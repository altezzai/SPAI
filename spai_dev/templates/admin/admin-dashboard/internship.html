<div id="internship" class="data-section">
  <div class="section-header-container">
    <div class="section-header">Internship Program</div>
    <button class="btn-create" onclick="openCreateModal('internship')"><span>+ Add Intern</span></button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="col-name">Name</th>
          <th class="col-role">Role</th>
          <th class="col-desc">Description</th>
          <th class="col-img">Profile</th>
          <th class="col-actions">Actions</th>
        </tr>
      </thead>
      <tbody id="internship-tbody">
        {% for item in internship_data %}
          <tr class="data-row" data-id="{{ item.pk }}" data-type="internship">
            <td>
              <strong>{{ item.name }}</strong>
            </td>
            <td class="col-role">{{ item.role }}</td>
            <td class="description-cell">{{ item.description }}</td>
            <td>
              {% if item.image %}
                <img src="{{ item.image.url }}" alt="{{ item.name }}" class="profile-pic" data-image="{{ item.image.url }}" />
              {% else %}
                <div class="profile-pic" style="background:#eee; display:flex; align-items:center; justify-content:center; color:#999; font-size:0.8rem;">No Img</div>
              {% endif %}
            </td>
            <td>
              <div class="action-group">
                <button class="btn-icon btn-edit" onclick="openEditModal({{ item.pk }}, 'internship')">Edit</button>
                <button class="btn-icon btn-delete" onclick="openDeleteModal({{ item.pk }}, '{{ item.name }}', 'internship')">Delete</button>
              </div>
            </td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="5" style="text-align:center; padding: 40px; color: var(--text-muted);">No interns found. Click "Add Intern" to create one.</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
