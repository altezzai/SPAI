{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Delete</title>
    <link rel="icon" type="image/x-icon" href="{% static 'image/SPAI_LOGO-removebg.png' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 100px auto;
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .container h1 {
            text-align: center;
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #333;
        }

        .warning-icon {
            font-size: 3rem;
            text-align: center;
            color: #dc3545;
            margin-bottom: 20px;
        }

        .message {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .item-info {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #dc3545;
        }

        .item-info p {
            margin: 5px 0;
            color: #333;
        }

        .item-info strong {
            color: #dc3545;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button,
        a.btn {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s, background-color 0.2s;
        }

        button[type="submit"] {
            background-color: #dc3545;
            color: white;
        }

        button[type="submit"]:hover {
            background-color: #c82333;
            transform: scale(1.05);
        }

        a.btn-cancel {
            background-color: #6c757d;
            color: white;
        }

        a.btn-cancel:hover {
            background-color: #5a6268;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="warning-icon">⚠️</div>
        <h1>Confirm Delete</h1>

        <p class="message">
            Are you sure you want to delete this {{ item_type|lower }}? This action cannot be undone.
        </p>

        <div class="item-info">
            <p><strong>Name:</strong> {{ item.name }}</p>
            {% if item.role %}
            <p><strong>Role:</strong> {{ item.role }}</p>
            {% endif %}
        </div>

        <form method="POST" style="display: inline;">
            {% csrf_token %}
            <div class="button-group">
                <button type="submit">Yes, Delete</button>
                <a href="{% url 'manage_dashboard' %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</body>

</html>
